{% if workspace_company %}
{% include "dashboard/_sidebar.html" with active=workspace_tab|default:'companies' %}
<div class="workspace-shell px-0">
    <div class="workspace-tabs ex-card mb-4 p-3">
        <div class="d-flex flex-column flex-lg-row justify-content-between gap-3 mb-3">
            <div>
                <div class="ex-kicker">Company workspace</div>
                <h5 class="mb-0 ex-serif">{{ workspace_company.company_name }}</h5>
            </div>
            <div style="min-width: 240px;">
                <label class="form-label small mb-1">Switch company</label>
                <select
                    class="form-select"
                    onchange="if (this.value) window.location.href = this.value;"
                >
                    {% for company in workspace_companies %}
                        <option
                            value="{% url 'company_workspace' company.id %}"
                            {% if company.id == workspace_company.id %}selected{% endif %}
                        >
                            {{ company.company_name }}
                        </option>
                    {% endfor %}
                </select>
            </div>
        </div>
        <ul class="nav">
            <li class="nav-item">
                <a class="nav-link {% if workspace_tab == 'overview' %}active{% endif %}" href="{% url 'company_workspace' workspace_company.id %}">Overview</a>
            </li>
            <li class="nav-item">
                <a class="nav-link {% if workspace_tab == 'products' %}active{% endif %}" href="{% url 'company_products_dashboard' workspace_company.id %}">Products</a>
            </li>
            <li class="nav-item">
                <a class="nav-link {% if workspace_tab == 'campaigns' %}active{% endif %}" href="{% url 'company_campaigns_dashboard' workspace_company.id %}">Campaigns</a>
            </li>
            <li class="nav-item">
                <a class="nav-link {% if workspace_tab == 'ai_content' %}active{% endif %}" href="{% url 'company_ai_content_dashboard' workspace_company.id %}">Content Studio</a>
            </li>
            <li class="nav-item">
                <a class="nav-link {% if workspace_tab == 'support' %}active{% endif %}" href="{% url 'company_support_dashboard' workspace_company.id %}">Support</a>
            </li>
            <li class="nav-item">
                <a class="nav-link {% if workspace_tab == 'knowledge' %}active{% endif %}" href="{% url 'company_knowledge_dashboard' workspace_company.id %}">Knowledge</a>
            </li>
            <li class="nav-item">
                <a class="nav-link {% if workspace_tab == 'reports' %}active{% endif %}" href="{% url 'company_reports_dashboard' workspace_company.id %}">Reports</a>
            </li>
        </ul>
    </div>
</div>
{% endif %}
