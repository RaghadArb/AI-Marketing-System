<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Support · {{ company.company_name }}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: #f5f6f8;
            font-family: "Manrope", "Segoe UI", sans-serif;
            min-height: 100vh;
            color: #1f2937;
        }
        .chat-shell { max-width: 760px; }
        .brand-bar {
            background: #172033;
            color: white;
            border-radius: 10px;
            padding: 20px 24px;
        }
        .brand-bar h1 { font-family: "Manrope", "Segoe UI", sans-serif; }
        .company-logo {
            width: 56px;
            height: 56px;
            object-fit: cover;
            border-radius: 8px;
            background: rgba(255,255,255,0.12);
            color: #d0d5dd;
        }
        .company-logo svg {
            width: 24px;
            height: 24px;
            stroke: currentColor;
            fill: none;
        }
        .chat-card {
            background: #fff;
            border: 1px solid #e6e9ef;
            border-radius: 16px;
            box-shadow: 0 14px 32px rgba(18, 24, 38, 0.06);
            min-height: 520px;
            display: flex;
            flex-direction: column;
        }
        .messages {
            flex: 1;
            overflow-y: auto;
            max-height: 480px;
            padding: 20px;
        }
        .bubble {
            max-width: 80%;
            padding: 12px 14px;
            border-radius: 12px;
            margin-bottom: 12px;
            white-space: pre-wrap;
        }
        .bubble-customer {
            background: #121826;
            color: #fff;
            margin-left: auto;
        }
        .bubble-customer .label { color: rgba(255,255,255,0.75); }
        .bubble-ai { background: #eef2f6; }
        .label {
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            margin-bottom: 4px;
            color: #6b7380;
        }
        .composer { border-top: 1px solid #e6e9ef; padding: 16px; }
        .typing { color: #6b7380; font-size: 13px; margin-bottom: 12px; }
        .btn-primary { background: #172033; border-color: #172033; }
        .btn-primary:hover { background: #0c121c; border-color: #0c121c; }
    </style>
</head>
<body>
{% include "dashboard/_icon_sprite.html" %}
<div class="container py-4 chat-shell">

    <div class="brand-bar d-flex align-items-center gap-3 mb-4">
        {% if company.logo %}
            <img src="{{ company.logo.url }}" alt="{{ company.company_name }} logo" class="company-logo">
        {% else %}
            <div class="company-logo d-flex align-items-center justify-content-center">
                <svg viewBox="0 0 24 24"><use href="#i-chat"/></svg>
            </div>
        {% endif %}
        <div>
            <div class="small opacity-75">Customer Support</div>
            <h1 class="h4 mb-0">{{ company.company_name }}</h1>
        </div>
    </div>

    <div class="chat-card">
        <div id="messages" class="messages">
            <div class="bubble bubble-ai">
                <div class="label">Support</div>
                Hello, welcome to {{ company.company_name }}. How can we help you today?
            </div>
        </div>
        <form id="chat-form" class="composer">
            {% csrf_token %}
            <label class="form-label visually-hidden" for="message">Message</label>
            <div class="input-group">
                <input
                    id="message"
                    name="message"
                    type="text"
                    class="form-control"
                    maxlength="2000"
                    placeholder="Type your question..."
                    required
                    autocomplete="off"
                >
                <button class="btn btn-primary" type="submit" id="send-btn">
                    Send
                </button>
            </div>
            <div id="chat-error" class="text-danger small mt-2 d-none"></div>
        </form>
    </div>
</div>

<script>
    const form = document.getElementById("chat-form");
    const input = document.getElementById("message");
    const messages = document.getElementById("messages");
    const sendBtn = document.getElementById("send-btn");
    const errorBox = document.getElementById("chat-error");
    const csrfToken = document.querySelector("[name=csrfmiddlewaretoken]").value;
    const messageUrl = "{% url 'customer_send_message' company.id %}";
    let conversationId = null;
    let sending = false;
    let typingEl = null;

    function addBubble(role, text) {
        const wrap = document.createElement("div");
        wrap.className = "bubble " + (role === "Customer" ? "bubble-customer" : "bubble-ai");
        wrap.innerHTML = '<div class="label"></div>';
        wrap.querySelector(".label").textContent = role === "Customer" ? "You" : "Support";
        wrap.appendChild(document.createTextNode(text));
        messages.appendChild(wrap);
        messages.scrollTop = messages.scrollHeight;
    }

    function setBusy(isBusy) {
        sending = isBusy;
        sendBtn.disabled = isBusy;
        input.disabled = isBusy;
        sendBtn.textContent = isBusy ? "Sending..." : "Send";
        if (isBusy) {
            typingEl = document.createElement("div");
            typingEl.className = "typing";
            typingEl.textContent = "Support is typing...";
            messages.appendChild(typingEl);
            messages.scrollTop = messages.scrollHeight;
        } else if (typingEl) {
            typingEl.remove();
            typingEl = null;
        }
    }

    form.addEventListener("submit", async function (event) {
        event.preventDefault();
        if (sending) return;
        const text = input.value.trim();
        if (!text) return;

        errorBox.classList.add("d-none");
        addBubble("Customer", text);
        input.value = "";
        setBusy(true);

        try {
            const payload = { message: text };
            if (conversationId) {
                payload.conversation_id = conversationId;
            }
            const response = await fetch(messageUrl, {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "X-CSRFToken": csrfToken
                },
                body: JSON.stringify(payload)
            });
            const data = await response.json();
            if (!response.ok) {
                throw new Error(data.error || "Could not send the message.");
            }
            conversationId = data.conversation_id;
            addBubble("AI", data.response || "");
        } catch (err) {
            errorBox.textContent = err.message;
            errorBox.classList.remove("d-none");
        } finally {
            setBusy(false);
            input.focus();
        }
    });
</script>
</body>
</html>
